<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Experiments</title>
    <link rel="icon" href="images/favicon.png" />
  </head>
  <body>
    <main>
      <template id="work-experience-template">
        <article>
          <header>
            <svg width="48" height="48" viewBox="0 0 48 48" role="img" aria-label="Company logo">
              <rect x="0" y="0" width="48" height="48" fill="gray" />
              <text x="24" y="29" text-anchor="middle" fill="white">Logo</text>
            </svg>
            <h3></h3>
            <p><span></span> &ndash; <span></span></p>
          </header>
          <p></p>
          <ul></ul>
        </article>
      </template>
      <canvas id="experiment-canvas" width="800" height="600" style="border: 1px solid #ccc;"></canvas>

      <section id="video-experiment">
        <h2>Video</h2>
        <video controls width="640" height="360" preload="metadata" poster="images/video-poster.jpg">
          <source src="media/demo.webm" type="video/webm" />
          <source src="media/demo.mp4" type="video/mp4" />
          <p>Your browser does not support HTML video. <a href="media/demo.mp4">Download the video</a> instead.</p>
        </video>
      </section>

      <section id="audio-experiment">
        <h2>Audio</h2>
        <audio controls preload="metadata">
          <source src="media/demo.ogg" type="audio/ogg" />
          <source src="media/demo.mp3" type="audio/mpeg" />
          <p>Your browser does not support HTML audio. <a href="media/demo.mp3">Download the audio</a> instead.</p>
        </audio>
      </section>
    </main>
    <script>
      const canvas = document.getElementById("experiment-canvas");
      const ctx = canvas.getContext("2d");

      canvas.addEventListener("mousemove", (event) => {
        const rect = canvas.getBoundingClientRect();

        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;

        ctx.fillStyle = "black";
        ctx.fillRect(x, y, 1, 1);
      });
    </script>
  </body>
</html>
